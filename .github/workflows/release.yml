name: Build & Release

# Both unfiltered on purpose: push gives every branch CI at push time instead of only at PR time,
# and pull_request is the only trigger that fires for forks and the only one that builds the branch
# already merged into its base. A PR branch therefore builds twice, which is accepted.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Never cancel an in-flight release on main - it could be mid-tag/publish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # VSIX projects (Microsoft.VSSDK.BuildTools) need full MSBuild from
      # Visual Studio, not the `dotnet` CLI.
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      # Restore dominates the job (VS SDK + Roslyn + MCP packages) and was paid by three separate restores below.
      - name: Cache NuGet packages
        id: nuget
        uses: actions/cache/restore@v4
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: msbuild RoslynQuery/RoslynQuery.csproj -t:Restore -p:Configuration=Release

      # Runs before the VSIX build so a broken predicate emitter/normalizer fails fast instead of
      # spending time packaging a VSIX. This restores and builds RoslynQuery.Tests (and its
      # ProjectReference to RoslynQuery) on its own; separate from the msbuild restore above.
      - name: Build tests
        run: dotnet build RoslynQuery.Tests/RoslynQuery.Tests.csproj -c Release

      # xunit.v3 on Microsoft.Testing.Platform emits a self-contained runner, so the exe is invoked
      # directly. That skips the `dotnet test` bridge entirely, which the .NET 10 SDK no longer
      # supports without an opt-in, and makes the runner's own exit code the step's result.
      - name: Test
        shell: pwsh
        run: |
          $exe = "RoslynQuery.Tests/bin/Release/net472/RoslynQuery.Tests.exe"
          if (-not (Test-Path $exe)) { throw "Test runner not found at $exe" }
          & $exe
          if ($LASTEXITCODE -ne 0) { throw "Tests failed with exit code $LASTEXITCODE." }

      # Runs after the tests on purpose: with RoslynQuery.Cli/publish present, the net472 WPF markup compile of the
      # extension project (what `dotnet build` of the tests triggers) fails with MC1000 on the published net11 assemblies.
      # The 11 SDK goes into its own folder so nothing else picks it up.
      #
      # The CLI ships inside the VSIX (Cli/<rid>/), self-contained so it needs no runtime install, and compiles the
      # engine from the extension's sources, so this also catches a VS-only dependency creeping into a shared file.
      # RoslynQuery.csproj picks the output up from RoslynQuery.Cli/publish. win-x86 is skipped: devenv is 64-bit only.
      - name: Publish CLI
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'dotnet11'
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile (Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1')
          & (Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1') -Channel 11.0 -InstallDir $sdk
          if ($LASTEXITCODE -ne 0) { throw "Installing the .NET 11 SDK failed." }
          foreach ($rid in 'win-x64', 'win-arm64') {
            & "$sdk\dotnet.exe" publish RoslynQuery.Cli/RoslynQuery.Cli.csproj -c Release -r $rid --self-contained -p:PublishReadyToRun=true -o "RoslynQuery.Cli/publish/$rid"
            if ($LASTEXITCODE -ne 0) { throw "CLI publish failed for $rid" }
          }

      - name: Build
        run: msbuild RoslynQuery/RoslynQuery.csproj -t:Rebuild -p:Configuration=Release -p:DeployExtension=false

      - name: Stage VSIX
        id: vsix
        shell: pwsh
        run: |
          $vsix = Get-ChildItem -Path RoslynQuery/bin/Release -Recurse -Filter *.vsix | Select-Object -First 1
          if (-not $vsix) { throw "No .vsix produced by the build." }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item $vsix.FullName artifacts/
          "path=artifacts/$($vsix.Name)" >> $env:GITHUB_OUTPUT
          Write-Host "Staged VSIX: $($vsix.Name)"

      # A bundled Microsoft.CodeAnalysis.* next to RoslynQuery.dll would be a duplicate assembly identity in devenv
      # and would break MEF composition, so a payload beyond our own dll is a hard failure. The CLI is the one
      # exception: it runs as its own process out of Cli/<rid>/, where devenv never loads anything from.
      - name: Verify VSIX payload
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "${{ steps.vsix.outputs.path }}").Path)
          $dlls = $zip.Entries | Where-Object { $_.Name -like '*.dll' }
          $unexpected = $dlls | Where-Object { $_.Name -ne 'RoslynQuery.dll' -and $_.FullName -notlike 'Cli/*' }
          $cli = @($zip.Entries | Where-Object { $_.FullName -in 'Cli/win-x64/roslynquery.exe', 'Cli/win-arm64/roslynquery.exe' })
          $cliBytes = ($zip.Entries | Where-Object { $_.FullName -like 'Cli/*' } | Measure-Object -Property CompressedLength -Sum).Sum
          $names = ($zip.Entries | Where-Object { $_.FullName -like '*roslynquery*' -or $_.FullName -like 'Cli*' } | Select-Object -First 20 | ForEach-Object FullName) -join ', '
          $zip.Dispose()
          Write-Host "CLI-ish entries: $names"
          if ($unexpected) { throw "VSIX carries assemblies it must not ship: $(($unexpected | ForEach-Object FullName) -join ', ')" }
          if ($cli.Count -ne 2) { throw "VSIX is missing the bundled CLI (found $($cli.Count) of 2 roslynquery.exe)." }
          Write-Host ("VSIX payload is clean. CLI payload: {0:N1} MB compressed." -f ($cliBytes / 1MB))

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: artifacts/*.vsix
          if-no-files-found: error

      # Saved explicitly (not via actions/cache's post step) so a red run still fills the cache: that post step is skipped
      # when the job fails, and a failing build is exactly when the next attempt needs the restore to be fast.
      - name: Save NuGet packages
        if: always() && steps.nuget.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json') }}

  # Releases the artifact the build job produced - it never rebuilds, so what ships is exactly
  # what was verified. Only pushes to main get here; other branches, PRs and manual
  # workflow_dispatch runs stop after build with just the artifact.
  #
  # success() is explicit and load-bearing here, not redundant with `needs: build`: a job's own
  # `if` replaces the implicit "only run if needs succeeded" check, so without it this would still
  # fire (and tag/release) even after a failed test run or build.
  release:
    needs: build
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # required to create releases / upload assets

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: vsix
          path: artifacts

      # The .csproj <Version> is the single source of truth: it's what the VSIX manifest is
      # stamped with, and it's what the release tag tracks.
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          [xml]$p = Get-Content RoslynQuery/RoslynQuery.csproj
          $v = ($p.Project.PropertyGroup.Version | Where-Object { $_ }) | Select-Object -First 1
          if (-not $v) { throw "No <Version> found in the .csproj." }
          $v = "$v".Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v -> tag v$v"

      # A release is cut only when <Version> is bumped to something not yet tagged. Pushes that
      # don't change the version still build + upload the artifact but skip the release, since
      # re-tagging an existing version would clobber it.
      - name: Check whether tag already exists
        id: tagcheck
        shell: pwsh
        run: |
          git fetch --tags --quiet
          $exists = (git tag --list "${{ steps.ver.outputs.tag }}")
          if ($exists) {
            Write-Host "Tag ${{ steps.ver.outputs.tag }} already exists - skipping release."
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Create Release
        if: steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: artifacts/*.vsix
